<div class="relative mb-6">
  <lucide-angular [img]="Search" class="absolute left-3 top-1/2 -translate-y-1/2 text-fg-3" size="18"></lucide-angular>
  <input
    aria-label="Buscar nombre o asiento"
    type="text"
    placeholder="Buscar nombre o asiento..."
    [value]="store.searchTerm()"
    (input)="onSearch($event)"
    class="w-full h-11 pl-10 pr-4 bg-fg/[0.06] border border-line rounded-full text-sm text-fg placeholder:text-fg-3 focus:border-brand-text focus:ring-2 focus:ring-brand-text/30 transition-colors outline-none"
  />
</div>
